# Root-path Netlify static deployment (Phase 12). See docs/PWA_ANDROID_OFFLINE.md.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback. Netlify serves a real file when one exists (the hashed chunks, /sw.js, the manifest,
# the icons) and only rewrites paths that have no file, so a cold deep link such as /weekly gets the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The shell and the worker must always revalidate, so a new deployment is noticed on the next load. (The browser also
# fetches /sw.js bypassing its HTTP cache; this keeps intermediaries honest too.)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The manifest and the icons have stable names, so they are never given a long lifetime either.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite content-hashes everything below /assets, so a file's name changes whenever its content does.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
